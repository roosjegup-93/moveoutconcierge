name: Import site from Plesk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site files
        run: |
          set -e
          mkdir -p images
          for f in index.html guides.html apartment-clearance-cost-amsterdam.html clearing-a-rental-after-tenant-leaves.html deposit-back-netherlands.html dutch-apartment-handover-inspection.html end-of-tenancy-clearance-amsterdam.html furniture-amsterdam-sell-donate-dispose.html leaving-the-netherlands-checklist.html moving-out-of-amsterdam-from-abroad.html useful-links-for-internationals.html robots.txt sitemap.xml images/amsterdam-apartment-ready-for-move-out.jpg images/cleaner-vacuuming-sofa-cushion.jpg images/empty-apartment-ready-for-handover.jpg images/empty-clean-living-room-amsterdam.jpg images/olav-and-rosalie-gubbels-amsterdam.jpg images/olav-carrying-box-amsterdam.jpg images/olav-with-packed-boxes-amsterdam.jpg; do
            curl -fsSL -A "Mozilla/5.0" -o "$f" "https://moveoutconcierge.com/$f"
          done
          echo "moveoutconcierge.com" > CNAME
          touch .nojekyll
          ls -la . images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import site files from Plesk" || echo "nothing to commit"
          git push
